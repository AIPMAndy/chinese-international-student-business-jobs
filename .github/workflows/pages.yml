name: Deploy verified business handbook
on:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/pages.yml', 'scripts/**', 'assets/**', 'content/**', 'cases/**', 'templates/**', 'research/**', 'downloads/**', 'README.md', 'PUBLISH.md', 'DEPLOYMENT.md', 'VERIFY.md', 'SOURCES.md', 'CONTRIBUTING.md', 'CONTENT_LICENSE.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'AIPMAndy/chinese-international-student-business-jobs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned static-site build dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild pages and downloadable source package from current source
        run: |
          npm run build
          python3 scripts/package.py
          npm run build
      - name: Verify all published page metadata and downloadable PDF
        run: python3 scripts/check_seo.py
      - name: Validate pages, anchors and all downloads
        run: python3 scripts/check_pages_links.py --require downloads/business-careers-guide.pdf --require downloads/repository-source.zip --require downloads/templates-and-cases.zip --require downloads/business-job-workbook.xlsx
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published HTML, assets and downloads
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          base = os.environ['LIVE_URL'].rstrip('/') + '/'
          paths = ["index.html", "read/verify.html", "read/deployment.html", "read/publish.html","read/content--00-start.html","assets/style.css","assets/app.js","assets/source-workbench.js","sources-workbench.html","robots.txt","sitemap.xml","downloads/business-careers-guide.pdf","downloads/business-job-workbook.xlsx","downloads/templates-and-cases.zip","downloads/repository-source.zip"]
          for path in paths:
              expected = (Path('dist') / path).read_bytes()
              expected_hash = hashlib.sha256(expected).hexdigest()
              url = base + path
              for attempt in range(8):
                  try:
                      request = Request(url, headers={'User-Agent': 'Andy-Guide-Pages-Verification/1.0', 'Accept-Encoding': 'identity', 'Cache-Control': 'no-cache'})
                      with urlopen(request, timeout=20) as response:
                          data = response.read()
                          status = response.status
                      actual_hash = hashlib.sha256(data).hexdigest()
                      if status != 200 or actual_hash != expected_hash:
                          raise RuntimeError(f'Published file differs from committed dist: {url}; HTTP {status}')
                      print('HTTP VERIFIED ' + json.dumps({'url': url, 'status': status, 'bytes': len(data), 'sha256': actual_hash}), flush=True)
                      break
                  except Exception as exc:
                      if attempt == 7:
                          raise
                      print(f'Retry {attempt + 1}/8 for {url}: {exc}', flush=True)
                      time.sleep(3)
          PY
