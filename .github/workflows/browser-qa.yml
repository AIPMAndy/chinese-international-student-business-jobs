name: Browser accessibility and search smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/build-site.mjs'
      - 'assets/app.js'
      - 'assets/source-workbench.js'
      - 'assets/style.css'
      - 'tests/browser_smoke.py'
      - '.github/workflows/browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    if: github.repository == 'AIPMAndy/chinese-international-student-business-jobs'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: python3 scripts/check_seo.py
      - run: python3 -m pip install --disable-pip-version-check playwright==1.56.0
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-handbook-browser-screenshots
          path: artifacts/browser-smoke/
          retention-days: 7
